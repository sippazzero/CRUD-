[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-ai"
version = "0.1.0"
description = "An AI-assisted helpdesk ticket service."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "email-validator==2.3.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "python-json-logger==3.3.0",
    "sqlalchemy[asyncio]==2.0.57",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

services:
  db:
    image: postgres:16.15@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-helpdesk}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/helpdesk_test
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_EMBEDDED_WORKER: ${RUN_EMBEDDED_WORKER:-false}
      HELPDESK_MOCK_HOST: ${HELPDESK_MOCK_HOST:-helpdesk-mock}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      LLM_DAILY_CALL_CAP: ${LLM_DAILY_CALL_CAP:-300}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-helpdesk}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ollama.com}
      LLM_MODEL: ${LLM_MODEL:-gemma4:31b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_STATIC_FALLBACK_ENABLED: ${LLM_STATIC_FALLBACK_ENABLED:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_DAILY_CALL_CAP: ${LLM_DAILY_CALL_CAP:-300}
      # Match the 60 RPM bucket at the provider's 30-second latency ceiling.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-30}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      WORKER_BACKOFF_BASE_SECONDS: ${WORKER_BACKOFF_BASE_SECONDS:-5}
      WORKER_BACKOFF_MAX_SECONDS: ${WORKER_BACKOFF_MAX_SECONDS:-300}
      SENDER_TIMEOUT_SECONDS: ${SENDER_TIMEOUT_SECONDS:-10}
      SENDER_MAX_ATTEMPTS: ${SENDER_MAX_ATTEMPTS:-5}
      SENDER_LEASE_SECONDS: ${SENDER_LEASE_SECONDS:-300}
      HELPDESK_MOCK_HOST: ${HELPDESK_MOCK_HOST:-helpdesk-mock}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  helpdesk-mock:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "uvicorn",
        "app.helpdesk_mock:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    ports:
      - "${HELPDESK_MOCK_PORT:-8001}:8001"
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_HANG_RATE: ${MOCK_HANG_RATE:-0}
      MOCK_HANG_SECONDS: ${MOCK_HANG_SECONDS:-15}
      MOCK_FAIL_BEFORE_RECORD: ${MOCK_FAIL_BEFORE_RECORD:-0}
      MOCK_DUPLICATE_MODE: ${MOCK_DUPLICATE_MODE:-false}
      MOCK_API_URL: ${MOCK_API_URL:-http://api:8000/webhooks/helpdesk}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
